name: myapp
description: A new Flutter project.

# Prevent accidental publishing to pub.dev.
publish_to: "none"

version: 1.0.0+1

environment:
  sdk: ^3.14.0

dependencies:
  # FLUTTER
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  material_ui: ^1.11.0
  cupertino_ui: ^1.1.6

  # HELPER
  equatable: ^3.0.0
  logger: ^2.8.0
  path_provider: ^2.1.6
  device_info_plus: ^13.3.0
  package_info_plus: ^10.2.2
  shared_preferences: ^2.5.6
  url_launcher: ^6.3.3
  formz: ^0.8.1
  freezed_annotation: ^3.1.0
  json_annotation: ^4.12.0
  dio: ^5.11.1
  connectivity_plus: ^7.3.2
  version: ^3.0.2
  intl: ^0.20.3
  permission_handler: ^13.0.2
  share_plus: ^13.3.1
  validators: ^3.0.0
  http_parser: ^4.1.2
  flutter_native_splash: ^2.4.8

  # WIDGET
  cupertino_icons: ^1.0.9
  photo_view: ^0.15.0
  modal_bottom_sheet: ^3.0.0
  bot_toast: ^4.1.3
  flutter_svg: ^2.4.0
  vector_graphics: ^1.3.1
  shimmer: ^4.0.0
  auto_size_text: ^3.0.0
  flutter_slidable: ^5.2.0
  cached_network_image: ^4.0.7
  lottie: ^3.8.2
  scrollable_positioned_list: ^0.3.8
  webview_flutter: ^4.14.1

  # STATE MANAGEMENT
  hydrated_bloc: ^11.0.0
  flutter_bloc: ^9.1.1
  go_router: ^18.1.4
  get_it: ^9.3.0
  injectable: ^3.0.0

  # FIREBASE
  firebase_core: ^5.1.0
  firebase_analytics: ^13.0.1
  firebase_app_check: ^0.5.1
  firebase_auth: ^7.0.1
  google_sign_in: ^7.2.0
  firebase_remote_config: ^7.0.1
  firebase_messaging: ^17.0.1
  cloud_firestore: ^7.1.0
  sentry_flutter: ^10.3.0
  sentry_logging: ^10.3.0
  # flutter_local_notifications: ^12.0.4
  # flutter_app_badger: ^1.5.0
  # firebase_dynamic_links: ^5.0.8
  # flutter_facebook_auth: ^5.0.6
  # sign_in_with_apple: ^4.2.0
  # uni_links: ^0.5.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  build_runner: ^2.16.1
  freezed: ^4.0.3
  json_serializable: ^6.15.2
  flutter_gen_runner: ^5.15.0
  injectable_generator: ^3.1.3
  flutter_launcher_icons: ^0.14.4
  mocktail: ^1.0.5
  bloc_test: ^10.0.0

flutter_gen:
  output: lib/generated/assets
  integrations:
    flutter_svg: true
    lottie: true

flutter:
  config:
    enable-swift-package-manager: true

  uses-material-design: true

  # Enable generation of localized Strings from arb files.
  generate: true

  assets:
    # Add assets from the images directory to the application.
    - assets/images/
    - assets/images/images/
    - assets/images/locale/
    - assets/lotties/
    - assets/svgs/
